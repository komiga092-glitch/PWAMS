<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWAMS - Offline</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <div data-sync-conflicts hidden></div>
        <div class="container">
            <div class="icon">&#128268;</div>
            <h1>PWAMS - Offline</h1>
            <p data-offline-note>You are offline. Supported pages below show data stored on this device; other features require a connection.</p>
            <table class="data-table" data-offline-table>
                <thead><tr><th>Record</th></tr></thead>
                <tbody></tbody>
            </table>
            <button onclick="location.reload()">Retry</button>
        </div>
    </main>
    <div class="offline-status" data-offline-status data-state="offline" role="status" aria-live="polite">Offline</div>
    <script>
        // Marks this document as the offline shell so the offline renderer
        // always renders locally cached data here, regardless of
        // navigator.onLine (which can be unreliable, e.g. captive portals).
        document.documentElement.dataset.offlineShell = "1";
        window.PWAMS_I18N = window.PWAMS_I18N || {};
    </script>
    <script type="module" src="/static/js/offline/pages.js"></script>
</body>
</html>
