{{ define "donor_edit_content" }}

<section class="page">

    <div class="page-heading">

        <div>
            <h1>Edit Donor</h1>
            <p>Update donor information.</p>
        </div>

        <a
            href="/donors/{{ .donor.ID }}/view"
            class="btn btn-secondary">
            Back
        </a>

    </div>

    <div class="panel">

        <form
            id="donor-edit-form"
            class="form"
            data-donor-id="{{ .donor.ID }}">

            <div class="form-grid">

                <div class="form-group">
                    <label for="donorName">
                        Name *
                    </label>

                    <input
                        id="donorName"
                        type="text"
                        name="name"
                        value="{{ .donor.Name }}"
                        required>
                </div>
<div class="form-group">
    <label for="donorType">
        Donor Type *
    </label>

    <select
        id="donorType"
        name="donor_type"
        required
    >
        <option value="">
            Select donor type
        </option>

        <option
            value="individual"
            {{ if eq .donor.DonorType "Individual" }}selected{{ end }}
        >
            Individual
        </option>

        <option
            value="organization"
            {{ if eq .donor.DonorType "Organization" }}selected{{ end }}
        >
            Organization
        </option>
    </select>
</div>

                <div class="form-group">
                    <label>NIC / Passport</label>

                    <input
                        type="text"
                        name="nic_passport"
                        value="{{ .donor.NICPassport }}">
                </div>

                <div class="form-group">
                    <label>Organization Name</label>

                    <input
                        type="text"
                        name="organization_name"
                        value="{{ .donor.OrganizationName }}">
                </div>

                <div class="form-group">
                    <label>Registration Number</label>

                    <input
                        type="text"
                        name="registration_number"
                        value="{{ .donor.RegistrationNumber }}">
                </div>

                <div class="form-group">
                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ .donor.Phone }}">
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ .donor.Email }}">
                </div>

                <div class="form-group">
                    <label>Contact Person Name</label>

                    <input
                        type="text"
                        name="contact_person_name"
                        value="{{ .donor.ContactPersonName }}">
                </div>

                <div class="form-group">
                    <label>Contact Person Phone</label>

                    <input
                        type="text"
                        name="contact_person_phone"
                        value="{{ .donor.ContactPersonPhone }}">
                </div>

                <div class="form-group">
                    <label>Preferred Donation Type</label>

                    <select
                        name="preferred_donation_type">

                        <option value="">
                            Select donation type
                        </option>

                        <option
                            value="cash"
                            {{ if eq .donor.PreferredDonationType "cash" }}
                            selected
                            {{ end }}>
                            Cash
                        </option>

                        <option
                            value="bank_transfer"
                            {{ if eq .donor.PreferredDonationType "bank_transfer" }}
                            selected
                            {{ end }}>
                            Bank Transfer
                        </option>

                        <option
                            value="goods"
                            {{ if eq .donor.PreferredDonationType "goods" }}
                            selected
                            {{ end }}>
                            Goods
                        </option>

                        <option
                            value="services"
                            {{ if eq .donor.PreferredDonationType "services" }}
                            selected
                            {{ end }}>
                            Services
                        </option>

                        <option
                            value="other"
                            {{ if eq .donor.PreferredDonationType "other" }}
                            selected
                            {{ end }}>
                            Other
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option
                            value="Active"
                            {{ if eq .donor.Status "Active" }}
                            selected
                            {{ end }}>
                            Active
                        </option>

                        <option
                            value="Inactive"
                            {{ if eq .donor.Status "Inactive" }}
                            selected
                            {{ end }}>
                            Inactive
                        </option>

                        <option
                            value="Pending"
                            {{ if eq .donor.Status "Pending" }}
                            selected
                            {{ end }}>
                            Pending
                        </option>

                    </select>
                </div>

                <div class="form-group form-full">
                    <label>Address</label>

                    <textarea
                        name="address"
                        rows="3">{{ .donor.Address }}</textarea>
                </div>

                <div class="form-group form-full">
                    <label>Notes</label>

                    <textarea
                        name="notes"
                        rows="3">{{ .donor.Notes }}</textarea>
                </div>

            </div>

            <div class="form-actions">

                <a
                    href="/donors/{{ .donor.ID }}/view"
                    class="btn btn-secondary">
                    Cancel
                </a>

                <button
                    id="donor-update-btn"
                    type="submit"
                    class="btn btn-primary">
                    Update Donor
                </button>

            </div>

        </form>

    </div>

</section>

<script src="/static/js/donor-edit.js"></script>

{{ end }}
