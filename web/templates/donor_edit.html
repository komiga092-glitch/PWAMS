{{ define "donor_edit_content" }}

<section class="page">

    <div class="page-heading">

        <div>
            <h1>{{t .Lang "donors.edit_title"}}</h1>
            <p>{{t .Lang "donors.edit_subtitle"}}</p>
        </div>

        <a
            href="/donors/{{ .donor.ID }}/view"
            class="btn btn-secondary">
            {{t .Lang "donors.back"}}
        </a>

    </div>

    <div class="panel">

        <form
            id="donor-edit-form"
            class="form"
            data-donor-id="{{ .donor.ID }}">

            <div class="form-grid">

                <div class="form-group">
                    <label for="donorName">
                        {{t .Lang "donors.name"}} *
                    </label>

                    <input
                        id="donorName"
                        type="text"
                        name="name"
                        value="{{ .donor.Name }}"
                        required>
                </div>
<div class="form-group">
    <label for="donorType">
        {{t .Lang "donors.donor_type"}} *
    </label>

    <select
        id="donorType"
        name="donor_type"
        required
    >
        <option value="">
            {{t .Lang "donors.select_donor_type"}}
        </option>

        <option
            value="individual"
            {{ if eq .donor.DonorType "Individual" }}selected{{ end }}
        >
            {{t .Lang "donors.individual"}}
        </option>

        <option
            value="organization"
            {{ if eq .donor.DonorType "Organization" }}selected{{ end }}
        >
            {{t .Lang "donors.organization"}}
        </option>
    </select>
</div>

                <div class="form-group">
                    <label>{{t .Lang "donors.nic_passport"}}</label>

                    <input
                        type="text"
                        name="nic_passport"
                        value="{{ .donor.NICPassport }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.organization_name"}}</label>

                    <input
                        type="text"
                        name="organization_name"
                        value="{{ .donor.OrganizationName }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.registration_number"}}</label>

                    <input
                        type="text"
                        name="registration_number"
                        value="{{ .donor.RegistrationNumber }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.phone"}}</label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ .donor.Phone }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.email"}}</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ .donor.Email }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.contact_person_name"}}</label>

                    <input
                        type="text"
                        name="contact_person_name"
                        value="{{ .donor.ContactPersonName }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.contact_person_phone"}}</label>

                    <input
                        type="text"
                        name="contact_person_phone"
                        value="{{ .donor.ContactPersonPhone }}">
                </div>

                <div class="form-group">
                    <label>{{t .Lang "donors.preferred_donation_type"}}</label>

                    <select
                        name="preferred_donation_type">

                        <option value="">
                            Select donation type
                        </option>

                        <option
                            value="cash"
                            {{ if eq .donor.PreferredDonationType "cash" }}
                            selected
                            {{ end }}>
                            Cash
                        </option>

                        <option
                            value="bank_transfer"
                            {{ if eq .donor.PreferredDonationType "bank_transfer" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.bank_transfer"}}
                        </option>

                        <option
                            value="goods"
                            {{ if eq .donor.PreferredDonationType "goods" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.goods"}}
                        </option>

                        <option
                            value="services"
                            {{ if eq .donor.PreferredDonationType "services" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.services"}}
                        </option>

                        <option
                            value="other"
                            {{ if eq .donor.PreferredDonationType "other" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.other"}}
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>{{t .Lang "common.status"}}</label>

                    <select name="status">

                        <option
                            value="Active"
                            {{ if eq .donor.Status "Active" }}
                            selected
                            {{ end }}>
                            {{t .Lang "common.active"}}
                        </option>

                        <option
                            value="Inactive"
                            {{ if eq .donor.Status "Inactive" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.inactive"}}
                        </option>

                        <option
                            value="Pending"
                            {{ if eq .donor.Status "Pending" }}
                            selected
                            {{ end }}>
                            {{t .Lang "donors.pending"}}
                        </option>

                    </select>
                </div>

                <div class="form-group form-full">
                    <label>{{t .Lang "donors.address"}}</label>

                    <textarea
                        name="address"
                        rows="3">{{ .donor.Address }}</textarea>
                </div>

                <div class="form-group form-full">
                    <label>{{t .Lang "donors.notes"}}</label>

                    <textarea
                        name="notes"
                        rows="3">{{ .donor.Notes }}</textarea>
                </div>

            </div>

            <div class="form-actions">

                <a
                    href="/donors/{{ .donor.ID }}/view"
                    class="btn btn-secondary">
                    {{t .Lang "common.cancel"}}
                </a>

                <button
                    id="donor-update-btn"
                    type="submit"
                    class="btn btn-primary">
                    {{t .Lang "donors.update"}}
                </button>

            </div>

        </form>

    </div>

</section>

<script src="/static/js/donor-edit.js"></script>

{{ end }}
