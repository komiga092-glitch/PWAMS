<!doctype html>
<html lang="{{ .Lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{t $.Lang "rp.title"}}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>

  <body>
    <div class="login-page">
      <section class="login-brand">
        <div class="brand-mark">PWA</div>

        <h1 style="margin-top: 24px">{{t $.Lang "rp.heading"}}</h1>

        <p>{{t $.Lang "rp.intro"}}</p>

        <div class="login-features">
          <div class="login-feature">✓ {{t $.Lang "rp.feature_min"}}</div>
          <div class="login-feature">✓ {{t $.Lang "rp.feature_hash"}}</div>
          <div class="login-feature">✓ {{t $.Lang "rp.feature_otp"}}</div>
        </div>
      </section>

      <section class="login-form-side">
        <div class="login-card">
          <h2>{{t $.Lang "rp.card_title"}}</h2>

          <p class="subtitle">{{t $.Lang "rp.card_subtitle"}}</p>

          <div id="message" class="alert" style="display: none"></div>

          <form id="resetPasswordForm">
            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="email"> {{t $.Lang "rp.email_label"}} </label>

              <input
                class="form-control"
                id="email"
                type="email"
                readonly
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="otp"> {{t $.Lang "rp.otp_label"}} </label>

              <input
                class="form-control"
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                readonly
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="newPassword"> {{t $.Lang "rp.new_password"}} </label>

              <input
                class="form-control"
                id="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 18px">
              <label class="form-label" for="confirmPassword">
                {{t $.Lang "rp.confirm_password"}}
              </label>

              <input
                class="form-control"
                id="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>

            <button class="btn btn-primary" style="width: 100%" type="submit">
              {{t $.Lang "rp.submit"}}
            </button>
          </form>

          <div style="text-align: center; margin-top: 18px">
            <a
              href="/login"
              style="color: var(--primary); font-size: 13px; font-weight: 700"
            >
              {{t $.Lang "rp.back_to_login"}}
            </a>
          </div>
        </div>
      </section>
    </div>

    <script src="/static/js/app.js"></script>

`
<script src="/static/js/pages/reset_password.js" defer></script>

  </body>
</html>
