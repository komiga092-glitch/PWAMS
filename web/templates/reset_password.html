<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - PWAMS</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>

  <body>
    <div class="login-page">
      <section class="login-brand">
        <div class="brand-mark">PWA</div>

        <h1 style="margin-top: 24px">Create a New Password</h1>

        <p>Enter and confirm your new PWAMS account password.</p>

        <div class="login-features">
          <div class="login-feature">✓ Minimum 8 characters</div>
          <div class="login-feature">✓ Secure password hashing</div>
          <div class="login-feature">✓ OTP protected reset</div>
        </div>
      </section>

      <section class="login-form-side">
        <div class="login-card">
          <h2>Reset Password</h2>

          <p class="subtitle">Set your new password.</p>

          <div id="message" class="alert" style="display: none"></div>

          <form id="resetPasswordForm">
            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="email"> Email </label>

              <input
                class="form-control"
                id="email"
                type="email"
                readonly
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="otp"> OTP </label>

              <input
                class="form-control"
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                readonly
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="newPassword"> New Password </label>

              <input
                class="form-control"
                id="newPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="form-group" style="margin-bottom: 18px">
              <label class="form-label" for="confirmPassword">
                Confirm Password
              </label>

              <input
                class="form-control"
                id="confirmPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>

            <button class="btn btn-primary" style="width: 100%" type="submit">
              Reset Password
            </button>
          </form>

          <div style="text-align: center; margin-top: 18px">
            <a
              href="/login"
              style="color: var(--primary); font-size: 13px; font-weight: 700"
            >
              Back to Login
            </a>
          </div>
        </div>
      </section>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);

      const email = params.get("email");
      const otp = params.get("otp");

      const emailInput = document.getElementById("email");
      const otpInput = document.getElementById("otp");
      const form = document.getElementById("resetPasswordForm");
      const message = document.getElementById("message");

      if (!email || !otp) {
        message.style.display = "block";
        message.className = "alert alert-danger";
        message.textContent =
          "Reset information is missing. Please request a new OTP.";

        form.style.display = "none";
      } else {
        emailInput.value = email;
        otpInput.value = otp;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const newPassword = document.getElementById("newPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        message.style.display = "none";

        if (newPassword !== confirmPassword) {
          message.style.display = "block";
          message.className = "alert alert-danger";
          message.textContent =
            "New password and confirm password do not match.";

          return;
        }

        if (newPassword.length < 8) {
          message.style.display = "block";
          message.className = "alert alert-danger";
          message.textContent = "Password must be at least 8 characters.";

          return;
        }

        try {
          const response = await fetch("/reset-password", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              email: email,
              otp: otp,
              new_password: newPassword,
              confirm_password: confirmPassword,
            }),
          });

          const data = await response.json();

          message.style.display = "block";

          if (response.ok && data.success) {
            message.className = "alert alert-success";
            message.textContent =
              data.message || "Password reset successfully.";

            form.reset();

            setTimeout(function () {
              window.location.href = "/login";
            }, 1500);
          } else {
            message.className = "alert alert-danger";
            message.textContent = data.message || "Unable to reset password.";
          }
        } catch (error) {
          message.style.display = "block";
          message.className = "alert alert-danger";
          message.textContent = "Unable to reset password. Please try again.";
        }
      });
    </script>
  </body>
</html>
