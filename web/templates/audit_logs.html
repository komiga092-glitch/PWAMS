{{ define "audit_logs_content" }}
<section class="page">
  <div class="page-heading">
    <div>
      <h1>{{t .Lang "audit.title"}}</h1>
      <p>{{t .Lang "audit.subtitle"}}</p>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>{{t .Lang "audit.recent"}}</h2>
      <span class="badge badge-muted">{{t .Lang "audit.system"}}</span>
    </div>

    <div class="panel-body">
      <div id="audit-log-container">
        <div class="empty">{{t .Lang "audit.loading"}}</div>
      </div>
    </div>
  </div>
</section>

<script>
  async function loadAuditLogs() {
    const container = document.getElementById("audit-log-container");

    try {
      const response = await fetch("/audit-logs", {
        method: "GET",
        credentials: "same-origin",
      });

      if (!response.ok) {
        throw new Error("Failed to load audit logs");
      }

      const result = await response.json();

      const logs = Array.isArray(result)
        ? result
        : result.data || result.logs || result.audit_logs || [];

      if (!logs.length) {
        container.innerHTML = '<div class="empty">{{t .Lang "audit.empty"}}</div>';
        return;
      }

      container.innerHTML = `
      <div style="overflow-x:auto;">
        <table class="table">
          <thead>
            <tr>
              <th>{{t .Lang "audit.action"}}</th>
              <th>{{t .Lang "audit.entity"}}</th>
              <th>{{t .Lang "audit.details"}}</th>
              <th>{{t .Lang "audit.created_at"}}</th>
              
            </tr>
          </thead>
          <tbody>
            ${logs
              .map(
                (log) => `
              <tr>
                <td>${escapeHtml(log.action || "-")}</td>
                <td>${escapeHtml(log.entity || "-")}</td>
                <td>${escapeHtml(log.details || "-")}</td>
                <td>${formatDate(log.created_at)}</td>
              </tr>
            `,
              )
              .join("")}
          </tbody>
        </table>
      </div>
    `;
    } catch (error) {
      console.error("Audit log loading error:", error);

      container.innerHTML =
        '<div class="empty">{{t .Lang "audit.error"}}</div>';
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleString();
  }

  document.addEventListener("DOMContentLoaded", loadAuditLogs);
</script>
{{ end }}
