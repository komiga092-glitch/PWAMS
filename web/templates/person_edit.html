{{ define "person_edit_content" }}

<section class="page">

    <div class="page-heading">

        <div>
            <h1>Edit Care Seeker</h1>
            <p>Update care seeker information.</p>
        </div>

        <a
            href="/persons/{{ .person.ID }}/view"
            class="btn btn-light">
            Cancel
        </a>

    </div>


    {{ if .error }}

        <div class="alert alert-danger">
            {{ .error }}
        </div>

    {{ end }}


    <div class="panel">

        <div class="panel-header">

            <h2>Personal Information</h2>

        </div>


        <div class="panel-body">

            <form
                id="person-edit-form"
                data-person-id="{{ .person.ID }}">

                <div class="form-grid">

                    <div class="form-group">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="full_name"
                            value="{{ .person.FullName }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            NIC / Passport
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="nic_passport"
                            value="{{ .person.NICPassport }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Date of Birth
                        </label>

                        <input
                            class="form-control"
                            type="date"
                            name="date_of_birth"
                            value="{{ .person.DateOfBirth }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            class="form-control"
                            name="gender">

                            <option
                                value=""
                                {{ if eq .person.Gender "" }}selected{{ end }}>
                                Select Gender
                            </option>

                            <option
                                value="Male"
                                {{ if eq .person.Gender "Male" }}selected{{ end }}>
                                Male
                            </option>

                            <option
                                value="Female"
                                {{ if eq .person.Gender "Female" }}selected{{ end }}>
                                Female
                            </option>

                            <option
                                value="Other"
                                {{ if eq .person.Gender "Other" }}selected{{ end }}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="phone"
                            value="{{ .person.Phone }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            class="form-control"
                            type="email"
                            name="email"
                            value="{{ .person.Email }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Occupation
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="occupation"
                            value="{{ .person.Occupation }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Monthly Income
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            name="monthly_income"
                            min="0"
                            step="0.01"
                            value="{{ .person.MonthlyIncome }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            class="form-control"
                            name="status"
                            required>

                            <option
                                value="Active"
                                {{ if eq .person.Status "Active" }}selected{{ end }}>
                                Active
                            </option>

                            <option
                                value="Inactive"
                                {{ if eq .person.Status "Inactive" }}selected{{ end }}>
                                Inactive
                            </option>

                            <option
                                value="Pending"
                                {{ if eq .person.Status "Pending" }}selected{{ end }}>
                                Pending
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            class="form-control"
                            name="address"
                            rows="4">{{ .person.Address }}</textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="/persons/{{ .person.ID }}/view"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Update Care Seeker
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

<script src="/static/js/person-edit.js"></script>

{{ end }}
