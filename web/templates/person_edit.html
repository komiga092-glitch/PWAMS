{{ define "person_edit_content" }}

<section class="page">

    <div class="page-heading">

        <div>
            <h1>{{t .Lang "persons.edit_title"}}</h1>
            <p>{{t .Lang "persons.edit_subtitle"}}</p>
        </div>

        <a
            href="/persons/{{ .person.ID }}/view"
            class="btn btn-light">
            {{t .Lang "common.cancel"}}
        </a>

    </div>


    {{ if .error }}

        <div class="alert alert-danger">
            {{ .error }}
        </div>

    {{ end }}


    <div class="panel">

        <div class="panel-header">

            <h2>{{t .Lang "persons.personal_info"}}</h2>

        </div>


        <div class="panel-body">

            <form
                id="person-edit-form"
                data-person-id="{{ .person.ID }}">

                <div class="form-grid">

                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.full_name"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="full_name"
                            value="{{ .person.FullName }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.nic_passport"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="nic_passport"
                            value="{{ .person.NICPassport }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.date_of_birth"}}
                        </label>

                        <input
                            class="form-control"
                            type="date"
                            name="date_of_birth"
                            value="{{ .person.DateOfBirth }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.gender"}}
                        </label>

                        <select
                            class="form-control"
                            name="gender">

                            <option
                                value=""
                                {{ if eq .person.Gender "" }}selected{{ end }}>
                                {{t .Lang "persons.select_gender"}}
                            </option>

                            <option
                                value="Male"
                                {{ if eq .person.Gender "Male" }}selected{{ end }}>
                                {{t .Lang "persons.male"}}
                            </option>

                            <option
                                value="Female"
                                {{ if eq .person.Gender "Female" }}selected{{ end }}>
                                {{t .Lang "persons.female"}}
                            </option>

                            <option
                                value="Other"
                                {{ if eq .person.Gender "Other" }}selected{{ end }}>
                                {{t .Lang "persons.other"}}
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.phone"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="phone"
                            value="{{ .person.Phone }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.email"}}
                        </label>

                        <input
                            class="form-control"
                            type="email"
                            name="email"
                            value="{{ .person.Email }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.occupation"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="occupation"
                            value="{{ .person.Occupation }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "persons.monthly_income"}}
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            name="monthly_income"
                            min="0"
                            step="0.01"
                            value="{{ .person.MonthlyIncome }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "common.status"}}
                        </label>

                        <select
                            class="form-control"
                            name="status"
                            required>

                            <option
                                value="Active"
                                {{ if eq .person.Status "Active" }}selected{{ end }}>
                                {{t .Lang "common.active"}}
                            </option>

                            <option
                                value="Inactive"
                                {{ if eq .person.Status "Inactive" }}selected{{ end }}>
                                {{t .Lang "persons.inactive"}}
                            </option>

                            <option
                                value="Pending"
                                {{ if eq .person.Status "Pending" }}selected{{ end }}>
                                {{t .Lang "persons.pending"}}
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            {{t .Lang "persons.address"}}
                        </label>

                        <textarea
                            class="form-control"
                            name="address"
                            rows="4">{{ .person.Address }}</textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="/persons/{{ .person.ID }}/view"
                        class="btn btn-secondary">
                        {{t .Lang "common.cancel"}}
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        {{t .Lang "persons.update"}}
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

<script src="/static/js/person-edit.js"></script>

{{ end }}
