<!doctype html>
<html lang="{{ .Lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{t $.Lang "otp.title"}}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="login-page">
      <section class="login-brand">
        <div class="brand-mark">PWA</div>

        <h1 style="margin-top: 24px">{{t $.Lang "otp.heading"}}</h1>

        <p>{{t $.Lang "otp.intro"}}</p>
      </section>

      <section class="login-form-side">
        <div class="login-card">
          <h2>{{t $.Lang "otp.card_title"}}</h2>

          <p class="subtitle">{{t $.Lang "otp.card_subtitle"}}</p>

          <div id="message" class="alert" style="display: none"></div>

          <form id="verifyOtpForm">
            <div class="form-group" style="margin-bottom: 16px">
              <label class="form-label" for="email"> {{t $.Lang "otp.email_label"}} </label>

              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                required
                readonly
              />
            </div>

            <div class="form-group" style="margin-bottom: 18px">
              <label class="form-label" for="otp"> {{t $.Lang "otp.otp_label"}} </label>

              <input
                class="form-control"
                id="otp"
                name="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="{{t $.Lang "otp.otp_placeholder"}}"
                required
              />
            </div>

            <button class="btn btn-primary" style="width: 100%" type="submit">
              {{t $.Lang "otp.verify"}}
            </button>
          </form>

          <div style="text-align: center; margin-top: 18px">
            <a
              href="/forgot-password"
              style="color: var(--primary); font-size: 13px; font-weight: 700"
            >
              {{t $.Lang "otp.send_again"}}
            </a>
          </div>
        </div>
      </section>
    </div>

    <script src="/static/js/app.js"></script>

`
<script src="/static/js/pages/verify_reset_otp.js" defer></script>

  </body>
</html>
