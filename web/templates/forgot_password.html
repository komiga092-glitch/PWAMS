{{ define "forgot_password.html" }}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - PWAMS</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>

  <body>
    <div class="login-page">
      <section class="login-brand">
        <div class="brand-mark">PWA</div>

        <h1 style="margin-top: 24px">Forgot Password</h1>

        <p>Enter your registered email address to receive an OTP.</p>
      </section>

      <section class="login-form-side">
        <div class="login-card">
          <h2>Reset your password</h2>

          <p class="subtitle">
            We will send a 6-digit OTP to your registered email.
          </p>

          <div id="message" class="alert" style="display: none"></div>

          <form id="forgotPasswordForm">
            <div class="form-group" style="margin-bottom: 18px">
              <label class="form-label" for="email"> Email Address </label>

              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <button class="btn btn-primary" style="width: 100%" type="submit">
              Send OTP
            </button>
          </form>

          <div style="text-align: center; margin-top: 18px">
            <a
              href="/login"
              style="color: var(--primary); font-size: 13px; font-weight: 700"
            >
              Back to Login
            </a>
          </div>
        </div>
      </section>
    </div>

    <script>
      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("email").value.trim();

          const message = document.getElementById("message");

          message.style.display = "none";

          try {
            const response = await fetch("/forgot-password", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: email,
              }),
            });

            const data = await response.json();

            message.style.display = "block";
            message.textContent = data.message || "Request completed.";

            if (response.ok && data.success) {
              window.location.href =
                "/verify-reset-otp?email=" + encodeURIComponent(email);
            }
          } catch (error) {
            message.style.display = "block";

            message.textContent =
              "Unable to process the request. Please try again.";
          }
        });
    </script>
  </body>
</html>
{{ end }}
