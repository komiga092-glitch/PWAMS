{{ define "student_edit" }}


<section class="page">

    <div class="page-heading">

        <div>
            <h1>{{t .Lang "students.edit_title"}}</h1>
            <p>{{t .Lang "students.edit_subtitle"}}</p>
        </div>

        <a
            href="/students/{{ .student.ID }}/view"
            class="btn btn-light">
            {{t .Lang "common.cancel"}}
        </a>

    </div>


    {{ if .error }}

    <div class="alert alert-danger">
        {{ .error }}
    </div>

    {{ end }}


    <div class="panel">

        <div class="panel-header">
            <h2>{{t .Lang "students.info_section"}}</h2>
        </div>

        <div class="panel-body">

            <form
                id="student-edit-form"
                data-student-id="{{ .student.ID }}">

                <input
    type="hidden"
    name="person_id"
    value="{{ .student.PersonID }}">

                <div class="form-grid">

                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.full_name"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="full_name"
                            value="{{ .student.FullName }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.student_code"}}
                        </label>

                        <div class="form-control">{{ .student.StudentCode }}</div>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.school"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="school_name"
                            value="{{ .student.SchoolName }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.grade"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="grade"
                            value="{{ .student.Grade }}"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.date_of_birth"}}
                        </label>

                        <input
                            class="form-control"
                            type="date"
                            name="date_of_birth"
                            value="{{ .student.DateOfBirth }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.gender"}}
                        </label>

                        <select
                            class="form-control"
                            name="gender">

                            <option
                                value=""
                                {{ if eq .student.Gender "" }}selected{{ end }}>
                                Select Gender
                            </option>

                            <option
                                value="Male"
                                {{ if eq .student.Gender "Male" }}selected{{ end }}>
                                Male
                            </option>

                            <option
                                value="Female"
                                {{ if eq .student.Gender "Female" }}selected{{ end }}>
                                Female
                            </option>

                            <option
                                value="Other"
                                {{ if eq .student.Gender "Other" }}selected{{ end }}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.guardian_name"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="guardian_name"
                            value="{{ .student.GuardianName }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.guardian_phone"}}
                        </label>

                        <input
                            class="form-control"
                            type="text"
                            name="guardian_phone"
                            value="{{ .student.GuardianPhone }}">

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "students.academic_year"}}
                        </label>

                        <input
                            class="form-control"
                            type="number"
                            name="academic_year"
                            value="{{ .student.AcademicYear }}"
                            min="2000"
                            max="2100"
                            required>

                    </div>


                    <div class="form-group">

                        <label class="form-label">
                            {{t .Lang "common.status"}}
                        </label>

                        <select
                            class="form-control"
                            name="status">

                            <option
                                value="Active"
                                {{ if eq .student.Status "Active" }}selected{{ end }}>
                                {{t .Lang "common.active"}}
                            </option>

                            <option
                                value="Inactive"
                                {{ if eq .student.Status "Inactive" }}selected{{ end }}>
                                {{t .Lang "students.inactive"}}
                            </option>

                            <option
                                value="Pending"
                                {{ if eq .student.Status "Pending" }}selected{{ end }}>
                                {{t .Lang "students.pending"}}
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label class="form-label">
                            {{t .Lang "students.remarks"}}
                        </label>

                        <textarea
                            class="form-control"
                            name="remarks"
                            rows="4">{{ .student.Remarks }}</textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <a
                        href="/students/{{ .student.ID }}/view"
                        class="btn btn-secondary">
                        {{t .Lang "common.cancel"}}
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        {{t .Lang "students.update"}}
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

<script src="/static/js/student-edit.js"></script>

{{ end }}
