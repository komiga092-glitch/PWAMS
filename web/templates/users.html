{{ define "users_content" }}

<section class="page">
  <div class="page-heading">
    <div>
      <h1>Users</h1>
      <p>Manage PWAMS system users, roles and account status.</p>
    </div>

    <button class="btn btn-primary" type="button" onclick="openUserModal()">
      + Add User
    </button>
  </div>

  <div id="user-alert"></div>

  <div class="panel">
    <div class="panel-body">
      <form class="toolbar" id="user-search-form">
        <input
          class="form-control search"
          type="search"
          name="search"
          placeholder="Search username or email..."
        />

        <select class="form-control" name="role" style="max-width: 190px">
          <option value="">All Roles</option>
          <option value="Super Admin">Super Admin</option>
          <option value="Admin">Admin</option>
          <option value="Staff">Staff</option>
          <option value="Volunteer">Volunteer</option>
          <option value="Donor">Donor</option>
          <option value="Beneficiary">Beneficiary</option>
        </select>

        <button class="btn btn-light" type="submit">Search</button>
      </form>
    </div>
  </div>

  <div class="panel" style="margin-top: 18px">
    <div class="panel-header">
      <h2>System Users</h2>
      <span class="badge badge-muted" id="user-count">0 Records</span>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Last Login</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="users-table">
          <tr>
            <td colspan="6">
              <div class="empty">Loading users...</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="panel-body" id="users-pagination"></div>
  </div>
</section>

<!-- USER MODAL -->

<div id="user-modal" class="modal-overlay" style="display: none">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2 id="user-modal-title">Add User</h2>
        <p>Create or update a PWAMS account.</p>
      </div>

      <button class="modal-close" type="button" onclick="closeUserModal()">
        ×
      </button>
    </div>

    <form id="user-form" class="form-grid">
      <input type="hidden" id="user-id" />

      <div class="form-group">
        <label class="form-label">Username *</label>
        <input
          class="form-control"
          id="user-username"
          name="username"
          minlength="3"
          maxlength="50"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <input
          class="form-control"
          id="user-email"
          name="email"
          type="email"
          required
        />
      </div>

      <div class="form-group" id="password-group">
        <label class="form-label">Password *</label>
        <input
          class="form-control"
          id="user-password"
          name="password"
          type="password"
          minlength="8"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Role *</label>

        <select class="form-control" id="user-role" name="role" required>
          <option value="Admin">Admin</option>
          <option value="Staff">Staff</option>
          <option value="Volunteer">Volunteer</option>
          <option value="Donor">Donor</option>
          <option value="Beneficiary">Beneficiary</option>
          <option value="Super Admin">Super Admin</option>
        </select>
      </div>

      <div class="form-group" id="status-group" style="display: none">
        <label class="form-label">Status *</label>

        <select class="form-control" id="user-status" name="status">
          <option value="Active">Active</option>
          <option value="Disabled">Disabled</option>
          <option value="Locked">Locked</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <div class="form-actions full">
        <button type="button" class="btn btn-light" onclick="closeUserModal()">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">Save User</button>
      </div>
    </form>
  </div>
</div>

<!-- PASSWORD MODAL -->

<div id="password-modal" class="modal-overlay" style="display: none">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2>Reset Password</h2>
        <p>Set a new password for this user.</p>
      </div>

      <button class="modal-close" type="button" onclick="closePasswordModal()">
        ×
      </button>
    </div>

    <form id="password-form" class="form-grid">
      <input type="hidden" id="password-user-id" />

      <div class="form-group full">
        <label class="form-label">New Password *</label>

        <input
          class="form-control"
          id="new-password"
          type="password"
          minlength="8"
          required
        />
      </div>

      <div class="form-actions full">
        <button
          type="button"
          class="btn btn-light"
          onclick="closePasswordModal()"
        >
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">Change Password</button>
      </div>
    </form>
  </div>
</div>

<script>
  let currentPage = 1;

  function showUserAlert(message, success = false) {
    const box = document.getElementById("user-alert");

    box.innerHTML = `
        <div class="alert ${success ? "alert-success" : "alert-danger"}"
             data-auto-dismiss>
            ${escapeHTML(message)}
        </div>
    `;

    setTimeout(() => {
      box.innerHTML = "";
    }, 4000);
  }

  function openUserModal() {
    document.getElementById("user-modal").style.display = "flex";

    document.getElementById("user-modal-title").textContent = "Add User";

    document.getElementById("user-form").reset();

    document.getElementById("user-id").value = "";

    document.getElementById("password-group").style.display = "flex";

    document.getElementById("status-group").style.display = "none";
  }

  function closeUserModal() {
    document.getElementById("user-modal").style.display = "none";
  }

  function openPasswordModal(id) {
    document.getElementById("password-user-id").value = id;

    document.getElementById("new-password").value = "";

    document.getElementById("password-modal").style.display = "flex";
  }

  function closePasswordModal() {
    document.getElementById("password-modal").style.display = "none";
  }

  function statusBadge(status) {
    if (status === "Active") {
      return `<span class="badge badge-success">${escapeHTML(status)}</span>`;
    }

    if (status === "Pending") {
      return `<span class="badge badge-warning">${escapeHTML(status)}</span>`;
    }

    if (status === "Disabled" || status === "Locked") {
      return `<span class="badge badge-danger">${escapeHTML(status)}</span>`;
    }

    return `<span class="badge badge-muted">${escapeHTML(status)}</span>`;
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  async function loadUsers(page = 1) {
    currentPage = page;

    const table = document.getElementById("users-table");

    const form = document.getElementById("user-search-form");

    const params = new URLSearchParams();

    const search = form.querySelector("[name=search]").value.trim();

    const role = form.querySelector("[name=role]").value;

    if (search) {
      params.set("search", search);
    }

    if (role) {
      params.set("role", role);
    }

    params.set("page", page);
    params.set("page_size", "10");

    table.innerHTML = `
        <tr>
            <td colspan="6">
                <div class="empty">Loading users...</div>
            </td>
        </tr>
    `;

    try {
      const response = await fetch(`/users?${params.toString()}`, {
        headers: {
          Accept: "application/json",
        },
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to load users");
      }

      const users = result.data || [];

      const pagination = result.pagination || {};

      document.getElementById("user-count").textContent =
        `${pagination.total_items ?? users.length} Records`;

      if (users.length === 0) {
        table.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty">No users found.</div>
                    </td>
                </tr>
            `;

        renderPagination(pagination);

        return;
      }

      table.innerHTML = users
        .map(
          (user) => `

            <tr>

                <td>
                    <strong>${escapeHTML(user.username)}</strong>
                </td>

                <td>
                    ${escapeHTML(user.email)}
                </td>

                <td>
                    <span class="badge badge-muted">
                        ${escapeHTML(user.role)}
                    </span>
                </td>

                <td>
                    ${statusBadge(user.status)}
                </td>

                <td>
                    ${
                      user.last_login_at
                        ? new Date(user.last_login_at).toLocaleString()
                        : "Never"
                    }
                </td>

                <td>

                    <div style="display:flex;gap:6px;flex-wrap:wrap;">

                        <button
                            class="btn btn-light"
                            type="button"
                            onclick="editUser('${user.id}')">
                            Edit
                        </button>

                        <button
                            class="btn btn-light"
                            type="button"
                            onclick="changeUserPassword('${user.id}')">
                            Password
                        </button>

                        <button
                            class="btn btn-light"
                            type="button"
                            onclick="changeUserStatus('${user.id}', '${user.status}')">
                            Status
                        </button>

                        <button
                            class="btn btn-danger"
                            type="button"
                            onclick="deleteUser('${user.id}', '${escapeHTML(user.username)}')">
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

        `,
        )
        .join("");

      renderPagination(pagination);
    } catch (error) {
      table.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        ${escapeHTML(error.message)}
                    </div>
                </td>
            </tr>
        `;
    }
  }

  function renderPagination(pagination) {
    const container = document.getElementById("users-pagination");

    const page = pagination.page || 1;

    const totalPages = pagination.total_pages || 1;

    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }

    container.innerHTML = `

        <div style="display:flex;justify-content:center;gap:8px;align-items:center;">

            <button
                class="btn btn-light"
                ${page <= 1 ? "disabled" : ""}
                onclick="loadUsers(${page - 1})">
                Previous
            </button>

            <span>
                Page ${page} of ${totalPages}
            </span>

            <button
                class="btn btn-light"
                ${page >= totalPages ? "disabled" : ""}
                onclick="loadUsers(${page + 1})">
                Next
            </button>

        </div>

    `;
  }

  async function editUser(id) {
    try {
      const response = await fetch(`/users/${id}`, {
        headers: {
          Accept: "application/json",
        },
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to load user");
      }

      const user = result.user;

      document.getElementById("user-id").value = user.id;

      document.getElementById("user-username").value = user.username;

      document.getElementById("user-email").value = user.email;

      document.getElementById("user-role").value = user.role;

      document.getElementById("user-status").value = user.status;

      document.getElementById("user-modal-title").textContent = "Edit User";

      document.getElementById("password-group").style.display = "none";

      document.getElementById("status-group").style.display = "flex";

      document.getElementById("user-modal").style.display = "flex";
    } catch (error) {
      showUserAlert(error.message);
    }
  }

  document
    .getElementById("user-form")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const id = document.getElementById("user-id").value;

      const username = document.getElementById("user-username").value.trim();

      const email = document.getElementById("user-email").value.trim();

      const role = document.getElementById("user-role").value;

      try {
        let url = "/users";

        let method = "POST";

        let body = {
          username,
          email,
          role,
        };

        if (id) {
          url = `/users/${id}`;

          method = "PUT";

          body.status = document.getElementById("user-status").value;
        } else {
          body.password = document.getElementById("user-password").value;
        }

        const response = await fetch(url, {
          method,
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify(body),
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Unable to save user");
        }

        closeUserModal();

        showUserAlert(result.message || "User saved successfully", true);

        await loadUsers(currentPage);
      } catch (error) {
        showUserAlert(error.message);
      }
    });

  async function changeUserStatus(id, currentStatus) {
    const statuses = ["Active", "Disabled", "Locked", "Pending"];

    const selected = prompt(
      `Enter new status:\n\n${statuses.join("\n")}`,
      currentStatus,
    );

    if (!selected || !statuses.includes(selected)) {
      return;
    }

    try {
      const response = await fetch(`/users/${id}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify({
          status: selected,
        }),
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to update status");
      }

      showUserAlert(result.message || "Status updated", true);

      await loadUsers(currentPage);
    } catch (error) {
      showUserAlert(error.message);
    }
  }

  async function changeUserPassword(id) {
    openPasswordModal(id);
  }

  document
    .getElementById("password-form")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const id = document.getElementById("password-user-id").value;

      const newPassword = document.getElementById("new-password").value;

      try {
        const response = await fetch(`/users/${id}/password`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({
            new_password: newPassword,
          }),
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Unable to reset password");
        }

        closePasswordModal();

        showUserAlert("Password changed successfully", true);
      } catch (error) {
        showUserAlert(error.message);
      }
    });

  async function deleteUser(id, username) {
    if (
      !confirm(`Delete user "${username}"?\n\nThis action cannot be undone.`)
    ) {
      return;
    }

    try {
      const response = await fetch(`/users/${id}`, {
        method: "DELETE",
        headers: {
          Accept: "application/json",
        },
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.message || "Unable to delete user");
      }

      showUserAlert("User deleted successfully", true);

      await loadUsers(currentPage);
    } catch (error) {
      showUserAlert(error.message);
    }
  }

  document
    .getElementById("user-search-form")
    .addEventListener("submit", (event) => {
      event.preventDefault();
      loadUsers(1);
    });

  document.addEventListener("DOMContentLoaded", () => {
    loadUsers(1);
  });
</script>

{{ end }}
