{{ define "persons_content" }}

<section class="page" data-persons-page>

    <div class="page-heading">
        <div>
            <h1>Care Seekers</h1>
            <p>Manage beneficiary and care seeker information.</p>
        </div>

        <button
            class="btn btn-primary"
            type="button"
            onclick="openPersonModal()">
            + Add Care Seeker
        </button>
    </div>

    <!-- Search / Filter -->
    <div class="panel">
        <div class="panel-body">

            <form class="toolbar" id="person-search-form">

                <input
                    class="form-control search"
                    type="search"
                    name="search"
                    placeholder="Search name, NIC, phone or email...">

                <select
                    class="form-control"
                    name="status"
                    style="max-width:180px;">

                    <option value="">All Status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="Pending">Pending</option>

                </select>

                <button
                    class="btn btn-light"
                    type="submit">
                    Search
                </button>

            </form>

        </div>
    </div>

    <!-- Persons Table -->
    <div class="panel" style="margin-top:18px;">

        <div class="panel-header">
            <h2>Care Seeker List</h2>

            <span class="badge badge-muted" id="person-count">0 Records</span>
        </div>

        <div class="table-wrap">

            <table class="data-table">

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>NIC / Passport</th>
                        <th>Phone</th>
                        <th>Gender</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="persons-table">

                    <tr>
                        <td colspan="6">
                            <div class="empty">
                                No care seekers loaded yet.
                            </div>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>


<!-- Add Person Modal -->

<div
    id="person-modal"
    class="modal-overlay"
    style="display:none;">

    <div class="modal-card">

        <div class="modal-header">

            <div>
                <h2>Add Care Seeker</h2>
                <p>Create a new beneficiary record.</p>
            </div>

            <button
                class="modal-close"
                type="button"
                onclick="closePersonModal()">
                ×
            </button>

        </div>


        <form
            id="person-form"
            class="form-grid"
            onsubmit="submitPerson(event)">

            <div class="form-group full">
                <label class="form-label">
                    Full Name *
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="full_name"
                    required>
            </div>


            <div class="form-group">
                <label class="form-label">
                    NIC / Passport *
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="nic_passport"
                    required>
            </div>


            <div class="form-group">
                <label class="form-label">
                    Date of Birth
                </label>

                <input
                    class="form-control"
                    type="date"
                    name="date_of_birth">
            </div>


            <div class="form-group">

                <label class="form-label">
                    Gender
                </label>

                <select
                    class="form-control"
                    name="gender">

                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Phone
                </label>

                <input
                    class="form-control"
                    type="tel"
                    name="phone">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Email
                </label>

                <input
                    class="form-control"
                    type="email"
                    name="email">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Occupation
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="occupation">

            </div>


            <div class="form-group">

                <label class="form-label">
                    Monthly Income
                </label>

                <input
                    class="form-control"
                    type="number"
                    step="0.01"
                    min="0"
                    name="monthly_income">

            </div>


            <div class="form-group full">

                <label class="form-label">
                    Address
                </label>

                <textarea
                    class="form-control"
                    name="address"
                    rows="3"></textarea>

            </div>


            <div class="form-group">

                <label class="form-label">
                    Status
                </label>

                <select
                    class="form-control"
                    name="status">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                </select>

            </div>


            <div
                class="form-actions full">

                <button
                    type="button"
                    class="btn btn-light"
                    onclick="closePersonModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Care Seeker
                </button>

            </div>

        </form>

    </div>

</div>

{{ end }}
