        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Number of records per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List persons
      tags:
      - Persons
    post:
      consumes:
      - application/json
      description: Create a new beneficiary/person record.
      parameters:
      - description: Person information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreatePersonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create person
      tags:
      - Persons
  /persons/{id}:
    delete:
      description: Delete an existing person record.
      parameters:
      - description: Person UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete person
      tags:
      - Persons
    get:
      description: Retrieve a single person by UUID.
      parameters:
      - description: Person UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get person
      tags:
      - Persons
    put:
      consumes:
      - application/json
      description: Update an existing person record.
      parameters:
      - description: Person UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated person information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePersonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
