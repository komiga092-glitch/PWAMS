definitions:
  models.CreatePersonRequest:
    properties:
      address:
        type: string
      date_of_birth:
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 150
        minLength: 3
        type: string
      gender:
        enum:
        - Male
        - Female
        - Other
        type: string
      monthly_income:
        minimum: 0
        type: number
      nic_passport:
        maxLength: 30
        type: string
      occupation:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
    required:
    - full_name
    - nic_passport
    type: object
  models.CreateUserRequest:
    properties:
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
  models.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.ResetPasswordRequest:
    properties:
      confirm_password:
        minLength: 8
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
      otp:
        type: string
    required:
    - confirm_password
    - email
    - new_password
    - otp
    type: object
  models.ResetUserPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  models.UpdatePersonRequest:
    properties:
      address:
        type: string
      date_of_birth:
        type: string
      email:
        maxLength: 100
        type: string
      full_name:
        maxLength: 150
        minLength: 3
        type: string
      gender:
        enum:
        - Male
        - Female
        - Other
        type: string
      monthly_income:
        minimum: 0
        type: number
      nic_passport:
        maxLength: 30
        type: string
      occupation:
        maxLength: 100
        type: string
      phone:
        maxLength: 20
        type: string
      status:
        type: string
    required:
    - full_name
    - nic_passport
    - status
    type: object
  models.UpdatePersonStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        maxLength: 100
        type: string
      role:
        type: string
      status:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - role
    - status
    - username
    type: object
  models.UpdateUserStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  models.VerifyResetOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
info:
  contact: {}
paths:
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit password reset OTP to the user's registered email.
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Send password reset OTP
      tags:
      - Authentication
  /login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Authenticate a user and create a session
      parameters:
      - description: Email or username
        in: formData
        name: login
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - text/html
      responses:
        "303":
          description: See Other
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - Authentication
  /logout:
    post:
      description: Revoke the current authenticated session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - Authentication
  /persons:
