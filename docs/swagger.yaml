      description: Change the status of an existing person.
      parameters:
      - description: Person UUID
        in: path
        name: id
        required: true
        type: string
      - description: Person status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdatePersonStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
